<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sign Recognition</title>
    <link rel="stylesheet" href="/static/mobile-fixes.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin: 20px 0 10px; color: #00d4ff; font-size: 1.8rem; }
        #camera-wrapper { position: relative; width: 640px; height: 480px; border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; overflow: hidden; background: #000; }
        #video  { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        #prediction-box { margin-top: 20px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 16px 40px; text-align: center; min-width: 400px; backdrop-filter: blur(10px); }
        #prediction-label { font-size: 2rem; font-weight: bold; color: #fff; min-height: 2.5rem; }
        #status-msg { font-size: 0.9rem; color: #aaa; margin-top: 6px; }
        #status-bar { margin-top: 12px; font-size: 0.85rem; color: #888; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #888; margin-right: 6px; vertical-align: middle; }
        .dot.green { background: #00e676; } .dot.red { background: #ff1744; }
        #record-btn { margin-top: 14px; padding: 12px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        #record-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #record-btn.recording { background: #ff1744; color: #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    </style>
</head>
<body>
    <nav style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;">
        <a href="/" style="padding:8px 16px;background:rgba(255,255,255,0.15);color:#fff;border-radius:8px;text-decoration:none;font-size:0.85rem;border:1px solid rgba(255,255,255,0.3);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">Text to Sign</a>
        <a href="/sign-recognition" style="padding:8px 16px;background:rgba(255,255,255,0.15);color:#fff;border-radius:8px;text-decoration:none;font-size:0.85rem;border:1px solid rgba(255,255,255,0.3);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">Upload Video</a>
        <a href="/live-sign-recognition" style="padding:8px 16px;background:rgba(255,255,255,0.25);color:#fff;border-radius:8px;text-decoration:none;font-size:0.85rem;border:2px solid rgba(255,255,255,0.5);font-weight:600;">Live Camera</a>
        <a href="/continuous-sign-recognition" style="padding:8px 16px;background:rgba(255,255,255,0.15);color:#fff;border-radius:8px;text-decoration:none;font-size:0.85rem;border:1px solid rgba(255,255,255,0.3);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">Continuous</a>
    </nav>

    <div style="text-center mb-4">
        <h1 style="color: #fff; font-size: 2rem; margin-bottom: 0.5rem; font-weight: bold;">ISL Translator</h1>
        <h2 style="color: rgba(255,255,255,0.9); font-size: 1.5rem; margin-bottom: 0.25rem; font-weight: 600;">Sign to Speech</h2>
        <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem;">Live Sign Recognition</p>
    </div>

    <div id="camera-wrapper">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
        <button id="record-btn" disabled style="padding: 12px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s;">Record Sign (3s)</button>
        <button id="switch-camera-btn" style="padding: 12px 20px; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.3s;">📷 Switch Camera</button>
    </div>

    <div id="prediction-box">
        <div id="prediction-label">—</div>
        <div id="status-msg">Press Record and perform a sign for 3 seconds</div>
    </div>

    <div id="status-bar">
        <span class="dot" id="cam-dot"></span><span id="cam-status">Camera: starting…</span>
        &nbsp;&nbsp;
        <span class="dot" id="model-dot"></span><span id="model-status">Model: checking…</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <script>
    const video       = document.getElementById('video');
    const canvas      = document.getElementById('canvas');
    const ctx         = canvas.getContext('2d');
    const predLabel   = document.getElementById('prediction-label');
    const statusMsg   = document.getElementById('status-msg');
    const recordBtn   = document.getElementById('record-btn');
    const switchCameraBtn = document.getElementById('switch-camera-btn');
    const camDot      = document.getElementById('cam-dot');
    const camStatus   = document.getElementById('cam-status');
    const modelDot    = document.getElementById('model-dot');
    const modelStatus = document.getElementById('model-status');

    let cameraStream = null;
    let mediaRecorder = null;
    let chunks = [];
    let currentFacingMode = 'user'; // 'user' = front camera, 'environment' = back camera
    let mpCam = null;

    fetch('/api/sign-recognition-status').then(r=>r.json()).then(d=>{
        if(d.model_loaded){ modelDot.classList.add('green'); modelStatus.textContent=`Model: ready (${d.n_classes} classes)`; }
        else { modelDot.classList.add('red'); modelStatus.textContent='Model: not loaded'; }
    });

    // ── Record 3s from raw camera stream and send to upload endpoint ─────
    recordBtn.addEventListener('click', () => {
        if (!cameraStream || mediaRecorder) return;
        chunks = [];

        // Use the raw camera stream (not the mirrored canvas) for accurate keypoints
        const mimeType = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm']
            .find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

        mediaRecorder = new MediaRecorder(cameraStream, { mimeType, videoBitsPerSecond: 2500000 });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = sendVideo;
        mediaRecorder.start(100);

        recordBtn.disabled = true;
        recordBtn.classList.add('recording');
        predLabel.textContent = '—';

        let t = 3;
        statusMsg.textContent = `Recording… ${t}s`;
        const timer = setInterval(() => {
            t--;
            if (t > 0) { statusMsg.textContent = `Recording… ${t}s`; }
            else { clearInterval(timer); mediaRecorder.stop(); }
        }, 1000);
    });

    async function sendVideo() {
        mediaRecorder = null;
        recordBtn.classList.remove('recording');
        statusMsg.textContent = 'Analyzing sign…';

        const ext = chunks[0]?.type?.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(chunks, { type: chunks[0]?.type || 'video/webm' });
        const fd = new FormData();
        fd.append('video', blob, `sign.${ext}`);

        try {
            const res  = await fetch('/upload-sign-video', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success && data.recognized_text) {
                predLabel.textContent = data.recognized_text;
                statusMsg.textContent = 'Sign detected!';
                if (data.audio_url) new Audio(data.audio_url).play();
            } else {
                predLabel.textContent = '—';
                statusMsg.textContent = data.message || 'No sign detected — try again';
            }
        } catch(e) {
            statusMsg.textContent = 'Error: ' + e.message;
        } finally {
            recordBtn.disabled = false;
        }
    }

    // ── MediaPipe landmark overlay only (no inference from JS landmarks) ──
    const holistic = new Holistic({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}` });
    holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false, refineFaceLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    holistic.onResults(results => {
        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Face Mesh (subtle)
        if (results.faceLandmarks) {
            drawConnectors(ctx, results.faceLandmarks, FACEMESH_TESSELATION, { color: 'rgba(255, 255, 255, 0.15)', lineWidth: 1 });
        }
        
        // Pose
        if (results.poseLandmarks) {
            drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00d4ff', lineWidth: 3 });
            drawLandmarks(ctx, results.poseLandmarks, { color: '#ffffff', fillColor: '#00d4ff', lineWidth: 2, radius: 4 });
        }
        
        // Hands
        if (results.leftHandLandmarks) {
            drawConnectors(ctx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00e676', lineWidth: 3 });
            drawLandmarks(ctx, results.leftHandLandmarks, { color: '#ffffff', fillColor: '#00e676', lineWidth: 2, radius: 5 });
        }
        if (results.rightHandLandmarks) {
            drawConnectors(ctx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#ff6d00', lineWidth: 3 });
            drawLandmarks(ctx, results.rightHandLandmarks, { color: '#ffffff', fillColor: '#ff6d00', lineWidth: 2, radius: 5 });
        }
    });

    // ── Start camera ─────────────────────────────────────────────────────
    async function startCamera(facingMode = 'user') {
        try {
            // Stop existing stream if any
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            if (mpCam) {
                mpCam.stop();
            }

            // Request camera with specified facing mode
            cameraStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480, facingMode: facingMode }, 
                audio: false 
            });
            
            video.srcObject = cameraStream;
            camDot.classList.remove('red');
            camDot.classList.add('green');
            camStatus.textContent = `Camera: ${facingMode === 'user' ? 'Front' : 'Back'}`;
            recordBtn.disabled = false;
            
            mpCam = new Camera(video, { 
                onFrame: async () => { await holistic.send({ image: video }); }, 
                width: 640, 
                height: 480 
            });
            mpCam.start();
        } catch (err) {
            camDot.classList.remove('green');
            camDot.classList.add('red');
            camStatus.textContent = 'Camera failed: ' + err.message;
            console.error('Camera error:', err);
        }
    }

    // ── Switch camera button ─────────────────────────────────────────────
    switchCameraBtn.addEventListener('click', () => {
        currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
        startCamera(currentFacingMode);
    });

    // Start with front camera
    startCamera('user');
    </script>
</body>
</html>
